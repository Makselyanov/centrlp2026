server {
    server_name centrlp.ru www.centrlp.ru;

    root /var/www/centrlp/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/xhtml+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirects from old URLs
    location = /services/tilda-website {
        return 301 /services/website-development;
    }
    location = /blog/lending-na-tilde-rukovodstvo {
        return 301 /blog/sozdanie-landinga-rukovodstvo;
    }

    # Redirect www to non-www
    if ($host = www.centrlp.ru) {
        return 301 https://centrlp.ru$request_uri;
    }

    # Static prerendered routes with real 404 for unknown URLs
    location / {
        try_files $uri $uri/index.html $uri/ @centrlp_not_found;
    }

    location @centrlp_not_found {
        return 404;
    }

    # Static assets - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # XML/JSON files - short cache for sitemap/robots
    location ~* \.(xml|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/centrlp.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/centrlp.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = centrlp.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name centrlp.ru www.centrlp.ru;
    return 404; # managed by Certbot
}
