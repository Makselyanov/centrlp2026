server {
    server_name centrlp.ru www.centrlp.ru;

    root /var/www/centrlp/dist;
    index index.html;
    error_page 404 /404.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/xhtml+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Normalize trailing slash (canonical URLs in sitemap are without slash)
    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    # Redirects from old URLs
    location = /metcoin {
        return 301 https://svrq.store/;
    }
    location ~ ^/metcoin/(.*)$ {
        return 301 https://svrq.store/products/$1;
    }
    location = /services/tilda-website {
        return 301 /services/website-development;
    }
    location = /blog/lending-na-tilde-rukovodstvo {
        return 301 /blog/sozdanie-landinga-rukovodstvo;
    }
    location = /services/prodvigaem {
        return 301 /services;
    }
    location = /services/prodvigaem/ {
        return 301 /services;
    }
    location = /services/razrabatyvaem {
        return 301 /services/website-development;
    }
    location = /services/razrabatyvaem/ {
        return 301 /services/website-development;
    }
    location = /services/povyshaem-effektivnost/seo-audit {
        return 301 /services/web-analytics;
    }
    location = /services/povyshaem-effektivnost/seo-audit/ {
        return 301 /services/web-analytics;
    }
    location = /services/povyshaem-effektivnost/integratsiya-s-1s {
        return 301 /services/custom-crm;
    }
    location = /services/povyshaem-effektivnost/integratsiya-s-1s/ {
        return 301 /services/custom-crm;
    }
    location = /services/soprovozhdaem {
        return 301 /services;
    }
    location = /services/soprovozhdaem/ {
        return 301 /services;
    }
    location = /services/soprovozhdaem/tekhnicheskaya-podderzhka {
        return 301 /services;
    }
    location = /services/soprovozhdaem/tekhnicheskaya-podderzhka/ {
        return 301 /services;
    }
    location = /services/prodvigaem/bazovoe-seo {
        return 301 /blog/lokalnoe-seo-dlya-biznesa-v-tyumeni;
    }
    location = /services/prodvigaem/bazovoe-seo/ {
        return 301 /blog/lokalnoe-seo-dlya-biznesa-v-tyumeni;
    }
    location = /services/prodvigaem/neyming {
        return 301 /services/naming-offers;
    }
    location = /services/prodvigaem/neyming/ {
        return 301 /services/naming-offers;
    }
    location = /services/razrabatyvaem/korporativnye-sayty {
        return 301 /services/website-development;
    }
    location = /services/razrabatyvaem/korporativnye-sayty/ {
        return 301 /services/website-development;
    }
    location = /articles {
        return 301 /blog;
    }
    location = /articles/ {
        return 301 /blog;
    }
    location = /articles/seo/chto-takoe-seo-prodvizhenie-sayta-i-v-chem-osobennost-uslugi {
        return 301 /blog/lokalnoe-seo-dlya-biznesa-v-tyumeni;
    }
    location = /articles/seo/chto-takoe-seo-prodvizhenie-sayta-i-v-chem-osobennost-uslugi/ {
        return 301 /blog/lokalnoe-seo-dlya-biznesa-v-tyumeni;
    }
    location = /agreement {
        return 301 /privacy;
    }
    location = /agreement/ {
        return 301 /privacy;
    }
    location = /company {
        return 301 /about;
    }
    location = /company/ {
        return 301 /about;
    }
    location = /company/index.php {
        return 301 /about;
    }
    location = /company/licenses {
        return 301 /about;
    }
    location = /company/licenses/ {
        return 301 /about;
    }
    location = /include/licenses_detail.php {
        return 301 /privacy;
    }
    location = /company/requisites {
        return 301 /about;
    }
    location = /company/requisites/ {
        return 301 /about;
    }
    location = /projects/internet-magaziny {
        return 301 /projects;
    }
    location = /projects/internet-magaziny/ {
        return 301 /projects;
    }
    location = /projects/gotovye-resheniya {
        return 301 /projects;
    }
    location = /projects/gotovye-resheniya/ {
        return 301 /projects;
    }
    location = /news/2017/audit-sayta-v-podarok {
        return 301 /blog/audit-saita-pered-zapuskom-reklamy-v-yandekse;
    }
    location = /news/2017/audit-sayta-v-podarok/ {
        return 301 /blog/audit-saita-pered-zapuskom-reklamy-v-yandekse;
    }

    # Redirect www to non-www
    if ($host = www.centrlp.ru) {
        return 301 https://centrlp.ru$request_uri;
    }

    # Lead form backend — Express+nodemailer on 127.0.0.1:3021.
    # Keeps PD processing inside RF per ФЗ-242 (replaced formsubmit.co).
    location = /api/lead {
        proxy_pass http://127.0.0.1:3021/api/lead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    # Static prerendered routes with real 404 for unknown URLs
    location / {
        try_files $uri $uri/index.html $uri/ @centrlp_not_found;
    }

    location @centrlp_not_found {
        return 404;
    }

    location = /404.html {
        internal;
    }

    # Static assets - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # XML/JSON files - short cache for sitemap/robots
    location ~* \.(xml|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/centrlp.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/centrlp.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name centrlp.ru www.centrlp.ru;
    return 301 https://centrlp.ru$request_uri;
}
