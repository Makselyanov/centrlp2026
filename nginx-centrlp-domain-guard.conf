# CentrLP domain guard.
#
# Exact production hosts are handled by their own server blocks. This guard
# prevents the wildcard DNS record from serving an unrelated virtual host for
# unknown *.centrlp.ru names and retires the unused signup endpoint.

server {
    listen 80;
    listen [::]:80;
    server_name signup.centrlp.ru;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 410;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name signup.centrlp.ru;

    ssl_certificate /etc/letsencrypt/live/signup.centrlp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signup.centrlp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 410;
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<unknown_centrlp_subdomain>(?:[a-z0-9-]+\.)*[a-z0-9-]+)\.centrlp\.ru$;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 421;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~^(?<unknown_centrlp_subdomain>(?:[a-z0-9-]+\.)*[a-z0-9-]+)\.centrlp\.ru$;

    # A non-matching wildcard request must never inherit another project's
    # content. The apex certificate is used only to complete TLS before the
    # request is rejected; unknown names are not advertised as valid hosts.
    ssl_certificate /etc/letsencrypt/live/centrlp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centrlp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 421;
}
