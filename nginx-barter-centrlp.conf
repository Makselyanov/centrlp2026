server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name barter.centrlp.ru;

    root /var/www/centrlp/dist;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        alias /var/www/centrlp/dist/barter/sto/index.html;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow:\n";
    }

    location = /sitemap.xml {
        return 404;
    }

    location = /dzen-rss.xml {
        return 404;
    }

    location = /api/lead {
        proxy_pass http://127.0.0.1:3021/api/lead;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location = /api/lead/health {
        proxy_pass http://127.0.0.1:3021/api/lead/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location = /api/lead/metrics {
        proxy_pass http://127.0.0.1:3021/api/lead/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32k;
    }

    location = /api/lead/event {
        proxy_pass http://127.0.0.1:3021/api/lead/event;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|webmanifest)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        return 302 https://centrlp.ru$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/barter.centrlp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barter.centrlp.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name barter.centrlp.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/crm/public;
    }

    location / {
        return 301 https://barter.centrlp.ru$request_uri;
    }
}
