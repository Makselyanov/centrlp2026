server {
    listen 80;
    listen [::]:80;
    server_name design.centrlp.ru www.design.centrlp.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://design.centrlp.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.design.centrlp.ru;

    ssl_certificate /etc/letsencrypt/live/design.centrlp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/design.centrlp.ru/privkey.pem;

    return 301 https://design.centrlp.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name design.centrlp.ru;

    ssl_certificate /etc/letsencrypt/live/design.centrlp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/design.centrlp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/design.centrlp.ru;
    index index.html;

    charset utf-8;

    # Старый дизайн-поддомен оставляем доступным, но выводим из индекса,
    # чтобы он не размывал основной доменный ресурс centrlp.ru в Google.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location = /sitemap.xml { add_header Content-Type application/xml; try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
