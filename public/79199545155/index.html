  <head>
    <meta charset="utf-8">

    <meta http-equiv="X-Robots-Tag" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>Preview screen</title>
    <style>
      :root {
        --red: #ed1b15;
        --focus: rgba(255, 255, 255, 0.92);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #111;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        display: flex;
        justify-content: center;
        overflow-x: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }

      a {
        color: inherit;
        -webkit-user-drag: none;
      }

      .preview {
        position: relative;
        width: min(1123px, 100vw);
        aspect-ratio: 1123 / 1323;
        overflow: hidden;
        background: #fff url("/79199545155/preview-screen.png?v=20260612b") center top / 100% 100% no-repeat;
        box-shadow: 0 0 0 4px #111;
        isolation: isolate;
      }

      .shield {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: rgba(255, 255, 255, 0.001);
        pointer-events: auto;
      }

      .hotspot {
        position: absolute;
        z-index: 4;
        left: var(--x);
        top: var(--y);
        width: var(--w);
        height: var(--h);
        display: block;
        overflow: hidden;
        border-radius: 0;
        color: transparent;
        text-indent: -9999px;
        outline: 0;
        cursor: pointer;
        transform: translateZ(0);
        transition:
          transform 160ms ease,
          filter 160ms ease;
      }

      .hotspot::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: transparent;
        box-shadow: none;
        opacity: 0;
        transition:
          opacity 160ms ease,
          background-color 160ms ease,
          box-shadow 160ms ease;
      }

      .hotspot:hover,
      .hotspot:focus-visible {
        transform: translateY(-4px);
      }

      .hotspot:hover::before,
      .hotspot:focus-visible::before {
        opacity: 1;
        background: rgba(255, 255, 255, 0.1);
        box-shadow:
          inset 0 0 0 2px rgba(255, 255, 255, 0.78),
          0 10px 18px rgba(0, 0, 0, 0.24);
      }

      .hotspot:focus-visible::before {
        box-shadow:
          inset 0 0 0 3px var(--focus),
          0 0 0 4px rgba(237, 27, 21, 0.58),
          0 10px 18px rgba(0, 0, 0, 0.24);
      }

      .hotspot:active {
        transform: translateY(1px) scale(0.99);
        transition-duration: 60ms;
      }

      .hotspot--red:hover::before,
      .hotspot--red:focus-visible::before {
        background: rgba(237, 27, 21, 0.22);
      }

      .hotspot--circle {
        border-radius: 50%;
      }

      .hotspot--circle:hover,
      .hotspot--circle:focus-visible {
        transform: translateY(-5px) scale(1.035);
      }

      .hotspot--cta {
        border-radius: 50%;
        animation: cta-breathe 3.2s ease-in-out infinite;
      }

      .hotspot--cta:hover,
      .hotspot--cta:focus-visible {
        animation-play-state: paused;
        transform: translateY(-7px) scale(1.02);
      }

      .hotspot--cta::before {
        border-radius: 50%;
      }

      .hotspot--cta:hover::before,
      .hotspot--cta:focus-visible::before {
        background: rgba(237, 27, 21, 0.2);
        box-shadow:
          inset 0 0 0 5px rgba(255, 255, 255, 0.72),
          0 18px 24px rgba(0, 0, 0, 0.2);
      }

      .hotspot--pay {
        cursor: default;
        pointer-events: none;
      }

      .hotspot--mobile {
        display: none;
      }

      @keyframes cta-breathe {
        0%,
        100% {
          filter: drop-shadow(0 0 0 rgba(237, 27, 21, 0));
        }

        50% {
          filter: drop-shadow(0 0 14px rgba(237, 27, 21, 0.28));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 640px) {
        .preview {
          width: min(390px, 100vw);
          aspect-ratio: 390 / 1840;
          background-image: url("/79199545155/preview-mobile.png?v=20260613a");
          box-shadow: 0 0 0 2px #111;
        }

        .hotspot--desktop {
          display: none;
        }

        .hotspot--mobile {
          display: block;
        }
      }

      @media print {
        body {
          display: none !important;
        }
      }
    </style>
  </head>

      <a class="hotspot hotspot--mobile hotspot--circle" href="tel:+79199545155" aria-label="Contact in Telegram" style="--x:70.2564%; --y:96.6304%; --w:9.2308%; --h:1.9565%;">Telegram</a>
      <a class="hotspot hotspot--mobile hotspot--circle" href="tel:+79199545155" aria-label="Contact in VK" style="--x:81.0256%; --y:96.6304%; --w:9.2308%; --h:1.9565%;">VK</a>
    </main>

    <script>
      (() => {
        const blocked = ["copy", "cut", "dragstart", "selectstart", "contextmenu"];
        for (const name of blocked) {
          document.addEventListener(name, (event) => event.preventDefault(), { capture: true });
        }

        document.addEventListener(
          "keydown",
          (event) => {
            const key = String(event.key || "").toLowerCase();
            if ((event.ctrlKey || event.metaKey) && ["a", "c", "p", "s", "u"].includes(key)) {
              event.preventDefault();
            }
          },
          { capture: true },
        );
      })();
    </script>
  </body>
</html>
