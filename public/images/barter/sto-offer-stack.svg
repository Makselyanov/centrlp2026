<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" rx="48" fill="#08131F"/>
  <rect x="48" y="48" width="1104" height="804" rx="40" fill="#091826" stroke="#163046" stroke-width="2"/>
  <text x="102" y="148" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="56" font-weight="700">Что именно получает СТО</text>
  <text x="102" y="194" fill="#8FA9BD" font-family="Arial, sans-serif" font-size="24">Сайт, квиз и реклама собраны в один рабочий пакет</text>

  <rect x="102" y="254" width="996" height="128" rx="28" fill="#0D1D2C" stroke="#20425E"/>
  <rect x="132" y="286" width="172" height="64" rx="22" fill="url(#accent)"/>
  <text x="170" y="328" fill="#03131E" font-family="Arial, sans-serif" font-size="28" font-weight="800">1. Сайт</text>
  <text x="354" y="314" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Страница под ваши услуги</text>
  <text x="354" y="352" fill="#8FA9BD" font-family="Arial, sans-serif" font-size="24">Отдельные офферы под ГБО, плёнку, антикор, автозвук, камеры</text>

  <rect x="102" y="406" width="996" height="128" rx="28" fill="#0D1D2C" stroke="#20425E"/>
  <rect x="132" y="438" width="172" height="64" rx="22" fill="url(#accent)"/>
  <text x="166" y="480" fill="#03131E" font-family="Arial, sans-serif" font-size="28" font-weight="800">2. Квиз</text>
  <text x="354" y="466" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Форма, которая собирает заявки</text>
  <text x="354" y="504" fill="#8FA9BD" font-family="Arial, sans-serif" font-size="24">Марка авто, задача, контакт, удобный способ связи</text>

  <rect x="102" y="558" width="996" height="128" rx="28" fill="#0D1D2C" stroke="#20425E"/>
  <rect x="132" y="590" width="172" height="64" rx="22" fill="url(#accent)"/>
  <text x="138" y="632" fill="#03131E" font-family="Arial, sans-serif" font-size="28" font-weight="800">3. Реклама</text>
  <text x="354" y="618" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="34" font-weight="700">Яндекс Директ и ВК под входящий поток</text>
  <text x="354" y="656" fill="#8FA9BD" font-family="Arial, sans-serif" font-size="24">Не просто клики, а заявки по вашим реальным направлениям</text>

  <rect x="102" y="710" width="996" height="88" rx="24" fill="#0D1D2C" stroke="#20425E"/>
  <circle cx="154" cy="754" r="9" fill="#20B5FF"/>
  <text x="176" y="762" fill="#DDE8F1" font-family="Arial, sans-serif" font-size="24">Каждый блок отвечает за свой участок пути: интерес, заявка и запись.</text>

  <defs>
    <linearGradient id="accent" x1="132" y1="286" x2="304" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20B5FF"/>
      <stop offset="1" stop-color="#35D39A"/>
    </linearGradient>
  </defs>
</svg>
