  <text x="110" y="194" fill="#8FA9BD" font-family="Arial, sans-serif" font-size="24">Этот визуал работает лучше, чем длинный абзац про “маркетинг под ключ”</text>

  <rect x="110" y="274" width="208" height="410" rx="30" fill="#0C1B2A" stroke="#1B3A54"/>
