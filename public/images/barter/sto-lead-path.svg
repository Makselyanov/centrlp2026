  <text x="906" y="378" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="36" font-weight="700">Запись</text>
  <text x="906" y="432" fill="#8FA9BD" font-family="Arial, sans-serif" font-size="24">Осмотр / приезд</text>
