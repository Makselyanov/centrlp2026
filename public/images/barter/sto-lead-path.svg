  <rect x="110" y="726" width="970" height="78" rx="22" fill="#0C1B2A" stroke="#1B3A54"/>
  <text x="146" y="775" fill="#DDE8F1" font-family="Arial, sans-serif" font-size="24">Такой блок объясняет владельцу СТО, как именно реклама превращается в запись, а не в “маркетинговую магию”.</text>

  <defs>
