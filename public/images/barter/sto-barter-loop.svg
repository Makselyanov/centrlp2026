<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" rx="48" fill="#071421"/>
  <rect x="40" y="40" width="1120" height="820" rx="40" fill="url(#bg)" stroke="url(#stroke)" stroke-width="2"/>
  <circle cx="938" cy="212" r="188" fill="url(#glow1)" opacity="0.35"/>
  <circle cx="226" cy="730" r="166" fill="url(#glow2)" opacity="0.3"/>
  <rect x="84" y="88" width="1032" height="724" rx="32" fill="#08111C" fill-opacity="0.78" stroke="#173047"/>

  <text x="110" y="152" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="56" font-weight="700">
    Бартер как понятная сделка
  </text>
  <text x="110" y="197" fill="#8FA9BD" font-family="Arial, sans-serif" font-size="24">
    Не абстрактный обмен, а согласованный пакет работ с эквивалентом и этапами
  </text>

  <rect x="110" y="254" width="368" height="346" rx="28" fill="#0B1725" stroke="#1F3D59"/>
  <rect x="128" y="274" width="164" height="36" rx="18" fill="#102437"/>
  <text x="154" y="298" fill="#8FD6FF" font-family="Arial, sans-serif" font-size="18" font-weight="700">Что получает СТО</text>
  <text x="142" y="362" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="42" font-weight="700">Сайт + квиз</text>
  <text x="142" y="408" fill="#D9E7F2" font-family="Arial, sans-serif" font-size="30" font-weight="600">Реклама + заявки</text>
  <text x="142" y="452" fill="#7FA1B8" font-family="Arial, sans-serif" font-size="24">
    Яндекс Директ, VK, аналитика, структура оффера
  </text>
  <circle cx="156" cy="518" r="8" fill="#20B5FF"/>
  <text x="178" y="526" fill="#D9E7F2" font-family="Arial, sans-serif" font-size="24">Одна точка входа для новых клиентов</text>
  <circle cx="156" cy="564" r="8" fill="#20B5FF"/>
  <text x="178" y="572" fill="#D9E7F2" font-family="Arial, sans-serif" font-size="24">Пакет под ваши реальные услуги</text>

  <rect x="722" y="254" width="368" height="346" rx="28" fill="#0B1725" stroke="#1F3D59"/>
  <rect x="740" y="274" width="184" height="36" rx="18" fill="#102437"/>
  <text x="766" y="298" fill="#7CEBC5" font-family="Arial, sans-serif" font-size="18" font-weight="700">Что получаю я</text>
  <text x="754" y="362" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="42" font-weight="700">ГБО, антикор,</text>
  <text x="754" y="408" fill="#D9E7F2" font-family="Arial, sans-serif" font-size="30" font-weight="600">тонировка, плёнка</text>
  <text x="754" y="452" fill="#7FA1B8" font-family="Arial, sans-serif" font-size="24">
    Плюс камеры, автозвук и доработка Pajero
  </text>
  <circle cx="768" cy="518" r="8" fill="#35D39A"/>
  <text x="790" y="526" fill="#D9E7F2" font-family="Arial, sans-serif" font-size="24">Работы можно разбить по этапам</text>
  <circle cx="768" cy="564" r="8" fill="#35D39A"/>
  <text x="790" y="572" fill="#D9E7F2" font-family="Arial, sans-serif" font-size="24">Эквивалент считаем прозрачно</text>

  <circle cx="600" cy="427" r="116" fill="#081624" stroke="url(#ring)" stroke-width="2"/>
  <path d="M600 328C649.7 328 692.3 359.6 710.7 404.2" stroke="url(#arrow1)" stroke-width="16" stroke-linecap="round"/>
  <path d="M715 387L730 421L694 430" stroke="#20B5FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 526C550.3 526 507.7 494.4 489.3 449.8" stroke="url(#arrow2)" stroke-width="16" stroke-linecap="round"/>
  <path d="M485 467L470 433L506 424" stroke="#35D39A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="560" y="434" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="26" font-weight="700">Эквивалент</text>
  <text x="548" y="468" fill="#7FA1B8" font-family="Arial, sans-serif" font-size="20">по смете</text>

  <rect x="110" y="654" width="980" height="112" rx="24" fill="#0B1725" stroke="#1B3850"/>
  <text x="144" y="706" fill="#F7FAFC" font-family="Arial, sans-serif" font-size="28" font-weight="700">Как устроен обмен</text>
  <text x="144" y="742" fill="#8FA9BD" font-family="Arial, sans-serif" font-size="22">
    <tspan x="144" dy="0">Состав работ, эквивалент по смете и порядок этапов</tspan>
    <tspan x="144" dy="28">видны заранее обеим сторонам.</tspan>
  </text>

  <defs>
    <linearGradient id="bg" x1="1120" y1="94" x2="68" y2="844" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2030"/>
      <stop offset="1" stop-color="#081119"/>
    </linearGradient>
    <linearGradient id="stroke" x1="105" y1="128" x2="1089" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E89C7"/>
      <stop offset="1" stop-color="#36C399"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(938 212) rotate(90) scale(188)">
      <stop stop-color="#19A9F6"/>
      <stop offset="1" stop-color="#19A9F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(226 730) rotate(90) scale(166)">
      <stop stop-color="#35D39A"/>
      <stop offset="1" stop-color="#35D39A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="486" y1="404" x2="714" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20B5FF"/>
      <stop offset="1" stop-color="#35D39A"/>
    </linearGradient>
    <linearGradient id="arrow1" x1="600" y1="328" x2="723" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20B5FF"/>
      <stop offset="1" stop-color="#35D39A"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="600" y1="526" x2="477" y2="442" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D39A"/>
      <stop offset="1" stop-color="#20B5FF"/>
    </linearGradient>
